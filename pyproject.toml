[project]
name = "modelops-lab"
version = "0.1.0"
description = "Production-oriented ML platform for tabular classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "mlflow>=2.18.0",
    "optuna>=4.1.0",
    "scikit-learn>=1.5.2",
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "pyarrow>=18.0.0",
    "lightgbm>=4.5.0",
    "xgboost>=2.1.2",
    "torch>=2.5.1",
    "joblib>=1.4.2",
    "pyyaml>=6.0.2",
    "typer>=0.14.0",
    "rich>=13.9.4",
    "httpx>=0.28.0",
    "opentelemetry-api>=1.28.2",
    "opentelemetry-sdk>=1.28.2",
    "opentelemetry-instrumentation-fastapi>=0.49b2",
    "opentelemetry-exporter-prometheus>=0.49b2",
    "prometheus-client>=0.21.0",
    "scipy>=1.14.1",
    "openml>=0.15.0",
    "python-multipart>=0.0.17",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.2",
    "mypy>=1.13.0",
    "types-PyYAML",
    "types-requests",
    "httpx",
]

[project.scripts]
modelops = "packages.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by wrap where it matters
    "B008",  # Typer uses function calls in argument defaults
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
packages = ["packages", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
