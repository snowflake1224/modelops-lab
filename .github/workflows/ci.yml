name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelops
          POSTGRES_PASSWORD: modelops
          POSTGRES_DB: modelops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check packages apps tests

      - name: Type check
        run: uv run mypy packages apps --ignore-missing-imports

      - name: Run tests
        env:
          DATABASE_URL: postgresql://modelops:modelops@localhost:5432/modelops
          MLFLOW_TRACKING_URI: sqlite:///data/mlflow.db
        run: uv run pytest tests/ -v --tb=short
